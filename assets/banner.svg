<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .pulse-pill {
        animation: pulsePill 4s ease-in-out infinite alternate;
      }
      .circuit-line {
        stroke-dasharray: 8 6;
        animation: dash 25s linear infinite;
      }
      .shield-glow {
        animation: shieldPulse 3s ease-in-out infinite alternate;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -25px) scale(1.2); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes shieldPulse {
        0% { filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4)); }
        100% { filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.8)); }
      }
      @keyframes pulsePill {
        0% { opacity: 0.85; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.02); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Border Outline with Gradient -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="glow-orb-1">
    <circle cx="180" cy="130" r="160" fill="url(#orbGrad1)"/>
  </g>
  <g class="glow-orb-2">
    <circle cx="1020" cy="270" r="180" fill="url(#orbGrad2)"/>
  </g>

  <!-- Dynamic Circuit / Security Flow Network Lines in Background -->
  <g stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5" fill="none" class="circuit-line">
    <path d="M 60 80 Q 250 30, 420 100 T 800 60 T 1140 100"/>
    <path d="M 80 340 Q 300 390, 560 320 T 960 350 T 1120 310"/>
    <path d="M 120 210 L 220 210 L 270 260 L 370 260"/>
    <path d="M 830 160 L 930 160 L 970 210 L 1080 210"/>
  </g>

  <!-- Network Nodes (Security Endpoints) -->
  <g fill="#818cf8" opacity="0.6">
    <circle cx="220" cy="210" r="3"/>
    <circle cx="270" cy="260" r="3"/>
    <circle cx="370" cy="260" r="3"/>
    <circle cx="830" cy="160" r="3"/>
    <circle cx="970" cy="210" r="3"/>
    <circle cx="1080" cy="210" r="3"/>
  </g>

  <!-- Foreground Content Container -->
  <!-- Top Badge / Category Pill -->
  <g transform="translate(600, 60)" text-anchor="middle" class="pulse-pill">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      ENTERPRISE IAM &amp; IDENTITY GOVERNANCE
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">
    Awesome Cloud Identity Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#f1f5f9">
    Curated SaaS Platforms, Zero Trust Frameworks &amp; Self-Hosted Open Source IAM
  </text>

  <!-- Tagline / Highlight description -->
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
    SSO &#8226; Adaptive MFA &#8226; Passwordless FIDO2 &#8226; SCIM Provisioning &#8226; OIDC / SAML 2.0 &#8226; AI Identity &amp; MCP
  </text>

  <!-- Dynamic Feature Badges / Spec Pills Row -->
  <g transform="translate(600, 290)" text-anchor="middle">
    <!-- Pill 1: Keycloak & Casdoor -->
    <g transform="translate(-360, 0)">
      <rect x="-95" y="-16" width="190" height="34" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="-75" cy="1" r="5" fill="#6366f1"/>
      <text x="10" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Open Source IAM</text>
    </g>

    <!-- Pill 2: Zero Trust & Passkeys -->
    <g transform="translate(-120, 0)">
      <rect x="-105" y="-16" width="210" height="34" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="1.2"/>
      <circle cx="-85" cy="1" r="5" fill="#0ea5e9"/>
      <text x="10" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Zero Trust &amp; Passkeys</text>
    </g>

    <!-- Pill 3: Enterprise Federation -->
    <g transform="translate(130, 0)">
      <rect x="-105" y="-16" width="210" height="34" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2"/>
      <circle cx="-85" cy="1" r="5" fill="#a855f7"/>
      <text x="10" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Enterprise Federation</text>
    </g>

    <!-- Pill 4: AI & Agentic Auth -->
    <g transform="translate(365, 0)">
      <rect x="-90" y="-16" width="180" height="34" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="-70" cy="1" r="5" fill="#10b981"/>
      <text x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">AI &amp; MCP Protocol</text>
    </g>
  </g>

  <!-- Bottom Visual Indicator / Trust Line -->
  <g transform="translate(600, 365)" text-anchor="middle">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1">
      COMPREHENSIVE DIRECTORY &#8226; PRODUCTION BENCHMARKS &#8226; ACTIVE 2026 AUDIT
    </text>
  </g>
</svg>
